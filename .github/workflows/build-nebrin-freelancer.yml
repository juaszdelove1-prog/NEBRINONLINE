name: Build NEBRIN Freelancer APK
on:
  workflow_dispatch:
  push:
    branches: [freelancer-app-v1]
    paths:
      - 'freelancer-app-v1/**'
      - '.github/workflows/build-nebrin-freelancer.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freelancer-app-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: freelancer-app-v1/package.json
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NEBRIN-Freelancer-APK
          path: freelancer-app-v1/android/app/build/outputs/apk/release/app-release.apk
