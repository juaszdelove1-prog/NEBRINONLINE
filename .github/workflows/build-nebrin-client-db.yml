name: Build NEBRIN Client Database APK

on:
  push:
    branches:
      - client-database-v2
    paths:
      - 'client-database-v2/**'
      - '.github/workflows/build-nebrin-client-db.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client-database-v2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JavaScript and collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'assets/(index\.android\.bundle|expo-root/)' || (echo 'JavaScript bundle missing from release APK' && exit 1)
          cp "$APK" NEBRIN-Client-Database-V2-Standalone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBRIN-Client-Database-V2-Standalone-APK
          path: client-database-v2/NEBRIN-Client-Database-V2-Standalone.apk
          if-no-files-found: error
          retention-days: 30
